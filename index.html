<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Santo Terço</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#17251f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Santo Terço">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: uma tela só. Cabeçalho com o mistério do dia, o terço desenhado no centro (toque = próxima conta), ações embaixo.
   Visual de capela: contas de pérola que viram ouro ao serem rezadas. Dois temas, escolhidos no app (escuro é o padrão). */
:root {
  /* Escuro: paleta verde-floresta e areia. Contas = diamantes claros. */
  --bg: #17251f;
  --surface: #1e2f27;
  --raised: #24382f;
  --line: #344b3a;
  --fg: #f1ebdd;
  --muted: #a6a078;
  --accent: #d6c99a;
  --btn: #d6c99a;
  --on-btn: #17251f;
  --gem1: #ffffff;
  --gem2: #dfe7e2;
  --gem3: #8fa298;
  --backdrop: rgba(8, 14, 11, .66);
  --sel: rgba(214, 201, 154, .1);
  --tag-bg: #d6c99a;
  --tag-fg: #17251f;
  --shadow: 0 6px 18px rgba(0, 0, 0, .28);
  --metal1: #f6f8f7;
  --metal2: #c3cac6;
  --metal3: #7f8a84;
  --metal-edge: rgba(255, 255, 255, .45);
  --shadow-c: #050a07;
  --shadow-o: .7;
  --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--bg);
}
:root[data-tema="claro"] {
  /* Claro: marfim, pedra e verde-floresta. Contas = esmeraldas. */
  --bg: #faf9f4;
  --surface: #f4f2ec;
  --raised: #ffffff;
  --line: #d6d3c8;
  --fg: #1b2a22;
  --muted: #767b72;
  --accent: #0f5132;
  --btn: #0f5132;
  --on-btn: #faf9f4;
  --gem1: #8fdcae;
  --gem2: #1f8050;
  --gem3: #093a23;
  --backdrop: rgba(27, 42, 34, .28);
  --sel: #e6f1e9;
  --tag-bg: #b7d9c1;
  --tag-fg: #0f5132;
  --shadow: 0 6px 16px rgba(27, 42, 34, .08);
  --metal1: #b9b5a8;
  --metal2: #7d796d;
  --metal3: #45423a;
  --metal-edge: rgba(40, 36, 28, .55);
  --shadow-c: #2a3a30;
  --shadow-o: .35;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; }
body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--ui);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  transition: background .3s, color .3s;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, main:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* Cabeçalho */
.top {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  padding-block: 12px 4px;
}
.setbtn {
  background: none;
  border: 0;
  padding: 4px 0;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.day {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
}
.setname {
  font-family: var(--display);
  font-size: 1.55rem;
  font-weight: 600;
  color: var(--accent);
  line-height: 1.1;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.setname svg { width: 14px; height: 14px; opacity: .7; flex: none; }
.top-right { display: flex; align-items: center; gap: 10px; padding-bottom: 2px; }
.step {
  height: 40px;
  padding: 0 14px 0 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--raised);
  box-shadow: var(--shadow);
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.step svg { width: 15px; height: 15px; flex: none; }

/* Balanço do terço a cada toque: a volta oscila presa no alto, o pingente balança um pouco mais */
#terco { transform-origin: 180px 26px; }
#pend { transform-origin: 180px 338px; }
#terco.sway { animation: sway 1.1s cubic-bezier(.3, .6, .4, 1); }
#terco.sway #pend { animation: sway-pend 1.3s cubic-bezier(.3, .6, .4, 1); }
@keyframes sway {
  0% { transform: rotate(0); }
  14% { transform: rotate(calc(var(--dir) * 1.5deg)); }
  36% { transform: rotate(calc(var(--dir) * -1deg)); }
  58% { transform: rotate(calc(var(--dir) * .55deg)); }
  80% { transform: rotate(calc(var(--dir) * -.22deg)); }
  100% { transform: rotate(0); }
}
@keyframes sway-pend {
  0% { transform: rotate(0); }
  18% { transform: rotate(calc(var(--dir) * -2.6deg)); }
  40% { transform: rotate(calc(var(--dir) * 1.9deg)); }
  62% { transform: rotate(calc(var(--dir) * -1.1deg)); }
  82% { transform: rotate(calc(var(--dir) * .45deg)); }
  100% { transform: rotate(0); }
}

/* Lista de posições do terço */
.jump { overflow-y: auto; display: flex; flex-direction: column; gap: 4px; padding-bottom: 4px; min-height: 0; }
.jump h4 {
  margin: 14px 0 4px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--accent);
}
.jump h4:first-child { margin-top: 0; }
.jump h4 small { display: block; margin-top: 2px; font-family: var(--display); font-style: italic; font-size: 15px; letter-spacing: 0; text-transform: none; color: var(--muted); font-weight: 500; }
.jitem {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 46px;
  padding: 8px 14px;
  border-radius: 14px;
  border: 1px solid transparent;
  background: transparent;
  text-align: left;
  font-size: 15px;
}
.jitem span:last-child { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; flex: none; }
.jitem.feito { color: var(--muted); }
.jitem.atual { border-color: var(--accent); background: var(--sel); color: var(--fg); font-weight: 600; }
.iconbtn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--raised);
  box-shadow: var(--shadow);
  display: grid;
  place-items: center;
  flex: none;
}
.iconbtn svg { width: 19px; height: 19px; }

/* Área de toque + terço */
main {
  flex: 1;
  min-height: 0;
  position: relative;
  display: grid;
  place-items: center;
  container-type: size;
  cursor: pointer;
  touch-action: manipulation;
  overflow: hidden;
}
.stage {
  position: relative;
  width: min(100cqw, 63.1cqh);
  aspect-ratio: 360 / 570;
  container-type: inline-size;
}
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

.s1 { stop-color: var(--gem1); }
.s2 { stop-color: var(--gem2); }
.s3 { stop-color: var(--gem3); }
.facet { pointer-events: none; }
.edge { fill: none; stroke: #fff; stroke-opacity: .32; stroke-width: .4; stroke-linejoin: round; }
.rim { fill: none; stroke: #000; stroke-opacity: .28; stroke-width: .7; stroke-linejoin: round; }
.glint { fill: #fff; opacity: .75; }
.spark { fill: #fff; opacity: .85; }
.sh { stop-color: var(--shadow-c); }
.shadow { opacity: var(--shadow-o); }
.m1 { stop-color: var(--metal1); }
.m2 { stop-color: var(--metal2); }
.m3 { stop-color: var(--metal3); }
.metal-edge { fill: none; stroke: var(--metal-edge); stroke-width: .7; stroke-linejoin: round; }
.cross-shadow { fill: var(--shadow-c); opacity: calc(var(--shadow-o) * .55); }
.bail { fill: none; stroke: url(#gMetal); stroke-width: 1.8; }
.boss { fill: url(#gMetal); stroke: var(--metal-edge); stroke-width: .5; }
.chain-shadow { fill: none; stroke: var(--shadow-c); stroke-opacity: calc(var(--shadow-o) * .5); stroke-width: 2; }
.chain-under { fill: none; stroke: var(--metal3); stroke-width: 1.9; }
.chain-links { fill: none; stroke: var(--metal1); stroke-width: 1.1; stroke-dasharray: 2.2 1.3; stroke-linecap: round; }
.b { transition: transform .45s cubic-bezier(.3, 1.5, .5, 1); }
.b .fill { opacity: 0; transition: opacity .5s ease; }
.b.done .fill, .b.cur .fill, .b.grp .fill { opacity: 1; }
.b.cur { transform: scale(1.6); }
.b.cur .fill { filter: brightness(1.18); }
.b.large.cur { transform: scale(1.45); }
.b.junction.cur { transform: scale(1.35); }
.b.cross.cur { transform: scale(1.08); }
.b.cross.grp { filter: none; }
.b.grp { filter: url(#glow); }
.b.grp.small { transform: scale(1.3); }
.all .b.grp { transform: none; }

#halo { transition: transform .5s cubic-bezier(.4, 0, .2, 1), opacity .4s; }
.halo-c { transform-origin: 0 0; animation: breathe 2.6s ease-in-out infinite; }
@keyframes breathe {
  0%, 100% { transform: scale(.82); opacity: .55; }
  50% { transform: scale(1.12); opacity: 1; }
}

/* Texto no centro do terço */
.center {
  position: absolute;
  left: 50%;
  top: 29%;
  transform: translate(-50%, -50%);
  width: 60%;
  text-align: center;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.2cqw;
}
.center.swap { animation: swapIn .42s ease; }
@keyframes swapIn {
  from { opacity: .15; transform: translate(-50%, calc(-50% + 2cqw)); }
  to { opacity: 1; transform: translate(-50%, -50%); }
}
.kicker {
  font-size: 3.1cqw;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--accent);
  text-wrap: balance;
}
.mname {
  font-family: var(--display);
  font-style: italic;
  font-weight: 500;
  font-size: 4.9cqw;
  line-height: 1.15;
  opacity: .85;
  text-wrap: balance;
}
.ptitle {
  font-family: var(--display);
  font-weight: 700;
  font-size: 9.4cqw;
  line-height: 1.02;
  text-wrap: balance;
  margin-top: 1cqw;
}
.ptitle.long { font-size: 7cqw; }
.ptitle.xlong { font-size: 6cqw; }
.count {
  font-size: 4.2cqw;
  font-weight: 600;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.count:empty, .mname:empty, .kicker:empty { display: none; }

/* Tema e idioma sempre à vista, no canto da área do terço */
/* Dois blocos simétricos no alto da área do terço:
   à esquerda tema e idioma, à direita Meditação e Imagem; mesmas alturas e espaçamentos */
.quick, .acts {
  position: absolute;
  top: 6px;
  z-index: 2;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.quick { left: 0; align-items: flex-start; }
.acts { right: 0; align-items: stretch; }
.mini {
  display: inline-flex;
  padding: 3px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--raised);
  box-shadow: var(--shadow);
}
.mini button {
  height: 32px;
  width: 42px;
  padding: 0;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .08em;
  display: grid;
  place-items: center;
  transition: background .2s, color .2s;
}
.mini button svg { width: 16px; height: 16px; }
.mini button[aria-pressed="true"] { background: var(--btn); color: var(--on-btn); }

/* Botão da imagem do mistério */
.imgbtn {
  height: 40px;
  justify-content: flex-start;
  padding: 0 14px 0 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--raised);
  box-shadow: var(--shadow);
  color: var(--accent);
  font-size: 13px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  animation: fade .4s ease;
}
.imgbtn svg { width: 17px; height: 17px; flex: none; }
.imgbtn.audbtn { text-decoration: none; }

/* Imagem do mistério em tela cheia (fundo escuro nos dois temas, como numa capela) */
.viewer {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: flex;
  flex-direction: column;
  padding-top: calc(16px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  color: #f1ebdd;
  cursor: zoom-out;
}
.viewer-bg { position: absolute; inset: 0; background: rgba(6, 10, 8, .95); animation: fade .35s ease; }
.viewer-fig {
  position: relative;
  flex: 1;
  min-height: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  animation: vin .55s cubic-bezier(.2, .8, .3, 1);
  transition: transform .25s ease, opacity .25s ease;
}
@keyframes vin { from { opacity: 0; transform: translateY(14px) scale(.97); } }
.viewer-fig img {
  flex: 1;
  min-height: 0;
  width: 100%;
  object-fit: contain;
  filter: drop-shadow(0 12px 30px rgba(0, 0, 0, .55));
}
.viewer-fig figcaption { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; flex: none; }
.v-kicker { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #d6c99a; }
.v-name { font-family: var(--display); font-style: italic; font-size: 1.45rem; line-height: 1.2; text-wrap: balance; max-width: 30ch; }
.v-autor { font-size: 12px; color: #a6a078; letter-spacing: .03em; }
.v-audio {
  margin-top: 10px;
  height: 46px;
  padding: 0 20px 0 16px;
  border-radius: 999px;
  border: 0;
  background: #d6c99a;
  color: #17251f;
  font-size: 15px;
  font-weight: 600;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
}
.v-audio svg { width: 18px; height: 18px; flex: none; }

/* Player do Spotify, que fica acima da barra de progresso enquanto o áudio do mistério toca */
.dock { display: flex; align-items: center; gap: 8px; margin-top: 6px; animation: fade .3s ease; }
.dock-player { flex: 1; min-width: 0; height: 80px; border-radius: 12px; overflow: hidden; background: var(--raised); }
.dock-player iframe { display: block; border: 0; border-radius: 12px; }

.v-close {
  position: absolute;
  top: calc(12px + env(safe-area-inset-top, 0px));
  right: max(12px, env(safe-area-inset-right, 0px));
  z-index: 1;
  background: rgba(36, 56, 47, .85);
  border-color: rgba(255, 255, 255, .15);
  color: #f1ebdd;
}

.hint {
  position: absolute;
  bottom: 6px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  letter-spacing: .04em;
  transition: opacity .6s;
  pointer-events: none;
}
.hint.gone { opacity: 0; }

.ripple {
  position: absolute;
  width: 28px;
  height: 28px;
  margin: -14px 0 0 -14px;
  border-radius: 50%;
  border: 1.5px solid var(--accent);
  pointer-events: none;
  animation: rip .65s ease-out forwards;
}
@keyframes rip {
  from { transform: scale(.6); opacity: .7; }
  to { transform: scale(4.5); opacity: 0; }
}

/* Progresso + botões */
.progress {
  height: 3px;
  border-radius: 3px;
  background: var(--line);
  overflow: hidden;
  margin-top: 6px;
}
.progress span {
  display: block;
  height: 100%;
  width: 0;
  background: var(--btn);
  transition: width .45s ease;
}
.bottom {
  display: grid;
  grid-template-columns: 1fr 1.7fr;
  gap: 10px;
  padding-block: 12px 14px;
}
.btn {
  height: 50px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--raised);
  box-shadow: var(--shadow);
  font-size: 15px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: background .2s, color .2s, border-color .2s, opacity .2s;
}
.btn svg { width: 18px; height: 18px; flex: none; }
.btn:active { background: var(--surface); }
.btn:disabled { opacity: .4; cursor: default; box-shadow: none; }
.btn.primary { background: var(--btn); border-color: var(--btn); color: var(--on-btn); }
.btn.primary:active { filter: brightness(.92); }
.btn.warn { border-color: var(--accent); color: var(--accent); }
.btn.wide { width: 100%; flex: none; }

/* Folhas (oração, mistérios, ajustes) */
.sheet-wrap {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}
.backdrop {
  position: absolute;
  inset: 0;
  background: var(--backdrop);
  animation: fade .25s ease;
}
@keyframes fade { from { opacity: 0; } }
.sheet {
  position: relative;
  max-height: 86%;
  display: flex;
  flex-direction: column;
  gap: 14px;
  background: var(--surface);
  color: var(--fg);
  border-top: 1px solid var(--line);
  border-radius: 22px 22px 0 0;
  padding-top: 10px;
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  animation: up .32s cubic-bezier(.2, .9, .3, 1);
}
@keyframes up { from { transform: translateY(100%); } }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto; flex: none; }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex: none; }
.sheet-head h2 {
  margin: 0;
  font-family: var(--display);
  font-size: 1.7rem;
  font-weight: 700;
  line-height: 1.1;
  text-wrap: balance;
}
.sheet-sub {
  margin: 4px 0 0;
  font-size: 13px;
  color: var(--muted);
}
.sheet-sub:empty { display: none; }
.sheet-body {
  overflow-y: auto;
  -webkit-user-select: text;
  user-select: text;
  display: flex;
  flex-direction: column;
  gap: 26px;
  padding-bottom: 4px;
  min-height: 0;
}
.prayer h3 {
  margin: 0 0 8px;
  font-family: var(--ui);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--accent);
}
.prayer p {
  margin: 0 0 .7em;
  font-family: var(--display);
  font-size: 1.32rem;
  line-height: 1.45;
  max-width: 34em;
}
.prayer p:last-child { margin-bottom: 0; }
.prayer .l, .prayer .inv, .prayer .resp { display: block; }
.prayer .inv { font-weight: 700; }
.prayer .resp { font-style: italic; padding-left: 1.2em; opacity: .85; }

.sets { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
.setopt {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  text-align: left;
  padding: 14px 16px;
  border-radius: 18px;
  border: 1px solid var(--line);
  background: var(--raised);
}
.setopt.sel { border-color: var(--accent); background: var(--sel); }
.setopt b { display: block; font-family: var(--display); font-size: 1.35rem; font-weight: 700; }
.setopt small { color: var(--muted); font-size: 13px; }
.tag {
  flex: none;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--tag-fg);
  background: var(--tag-bg);
  padding: 4px 8px;
  border-radius: 999px;
}

.opts { display: flex; flex-direction: column; gap: 18px; padding-bottom: 6px; }
.opt-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}
/* Crédito discreto no rodapé dos Ajustes */
.credit { margin: 4px 0 0; text-align: center; font-size: 12px; color: var(--muted); }
.linkbtn { border: 0; background: none; padding: 4px 2px; font-size: 12px; font-weight: 600; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

/* Tela de mensagem */
.msg-form { display: flex; flex-direction: column; gap: 14px; overflow-y: auto; min-height: 0; padding-bottom: 2px; }
.fld { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
.fld input, .fld textarea {
  font: 400 16px/1.4 var(--ui);
  color: var(--fg);
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 14px;
  -webkit-user-select: text;
  user-select: text;
  resize: vertical;
}
.fld input:focus, .fld textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.seg.seg3 { grid-template-columns: 1fr 1fr 1fr; }
.msg-status { margin: 0; font-size: 14px; color: var(--muted); }
.msg-status:empty { display: none; }
.msg-status.ok { color: var(--accent); font-weight: 600; }
.msg-status a { color: var(--accent); }

.seg {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  padding: 4px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--raised);
}
.seg button {
  height: 44px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  font-size: 15px;
  font-weight: 600;
  color: var(--muted);
  transition: background .2s, color .2s;
}
.seg button[aria-pressed="true"] { background: var(--btn); color: var(--on-btn); }

@media (prefers-reduced-motion: reduce) {
  .halo-c, .center.swap, .ripple, .sheet, .backdrop, #terco.sway, #terco.sway #pend { animation: none; }
  .b, #halo, .progress span { transition-duration: .01s; }
}
</style>

<!-- Textos das orações e nomes dos mistérios: edite em oracoes.js -->
<script src="oracoes.js"></script>
<script>
(function () {
  "use strict";

  const ORACOES = window.ORACOES;
  const MISTERIOS = window.MISTERIOS;
  const MISTERIOS_DO_DIA = window.MISTERIOS_DO_DIA;
  const IMAGENS = window.IMAGENS || {};
  const AUDIO = window.AUDIO || null;
  const DIAS = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"];

  /* ---------- Estrutura do terço ----------
     Cada passo = um toque na tela.
     titulo/secao: exatamente como nos arquivos da estrutura.
     contas: posição selecionada no terço.
     oracoes: chaves de ORACOES, na ordem em que aparecem. */

  const CRUZ = "cruz";
  const dezena = k => Array.from({ length: 10 }, (_, j) => "d" + k + "-" + (j + 1));
  const TODAS = ["cruz", "p0", "p1", "p2", "p3", "p4"]
    .concat([1, 2, 3, 4, 5].flatMap(k => ["L" + k].concat(dezena(k))));
  const ORDINAIS = ["Primeiro", "Segundo", "Terceiro", "Quarto", "Quinto"];

  function montarPassos() {
    const p = [];
    const visita = "Visita ao Santíssimo Sacramento";
    ["p1", "p2", "p3"].forEach((c, i) => p.push({
      secao: visita, titulo: "Adoração ao Santíssimo Sacramento", contagem: (i + 1) + " de 3",
      contas: [c], oracoes: ["adoracao", "paiNosso", "aveMaria", "gloria"]
    }));
    p.push({ secao: visita, titulo: "Comunhão Espiritual", contas: ["p4"], oracoes: ["adoracao", "comunhaoEspiritual"] });
    p.push({ titulo: "Sinal da Santa Cruz", contas: [CRUZ], oracoes: ["sinalDaCruz"] });
    p.push({ titulo: "Ato de Contrição", contas: [CRUZ], oracoes: ["atoDeContricao", "gloria"] });

    for (let k = 1; k <= 5; k++) {
      const secao = ORDINAIS[k - 1] + " Mistério";
      p.push({ secao, misterio: k, titulo: "Pai Nosso", contas: ["L" + k], oracoes: ["paiNosso"], novo: true });
      for (let j = 1; j <= 10; j++)
        p.push({ secao, misterio: k, titulo: "Ave Maria", contagem: j + " de 10", contas: ["d" + k + "-" + j], oracoes: ["aveMaria"] });
      p.push({ secao, misterio: k, titulo: "Glória ao Pai", contas: dezena(k), oracoes: ["gloria"] });
      p.push({ secao, misterio: k, titulo: "Oração de Fátima", contas: dezena(k), oracoes: ["oracaoDeFatima"] });
    }

    p.push({ titulo: "Ave Maria, Filha de Deus Pai", contas: TODAS, oracoes: ["aveFilha"], novo: true });
    p.push({ titulo: "Ave Maria, Mãe de Deus Filho", contas: TODAS, oracoes: ["aveMae"] });
    p.push({ titulo: "Ave Maria, Esposa de Deus Espírito Santo", contas: TODAS, oracoes: ["aveEsposa"] });
    p.push({ titulo: "Ladainha a Nossa Senhora", contas: TODAS, oracoes: ["ladainha"] });
    p.push({ titulo: "Para as necessidades da Igreja e do Estado", contas: TODAS, oracoes: ["paiNosso", "aveMaria", "gloria"] });
    p.push({ titulo: "Para a pessoa e as intenções do senhor Bispo desta Diocese", contas: TODAS, oracoes: ["paiNosso", "aveMaria", "gloria"] });
    p.push({ titulo: "Para as benditas almas do Purgatório", contas: TODAS, oracoes: ["paiNosso", "aveMaria", "gloria"] });
    // Passos cujo título é o nome de uma oração: na tela, o nome segue o idioma das orações
    const NOME_DA_ORACAO = {
      "Adoração ao Santíssimo Sacramento": "adoracao", "Comunhão Espiritual": "comunhaoEspiritual",
      "Sinal da Santa Cruz": "sinalDaCruz", "Ato de Contrição": "atoDeContricao",
      "Pai Nosso": "paiNosso", "Ave Maria": "aveMaria", "Glória ao Pai": "gloria", "Oração de Fátima": "oracaoDeFatima",
      "Ave Maria, Filha de Deus Pai": "aveFilha", "Ave Maria, Mãe de Deus Filho": "aveMae",
      "Ave Maria, Esposa de Deus Espírito Santo": "aveEsposa", "Ladainha a Nossa Senhora": "ladainha"
    };
    p.forEach(x => { if (NOME_DA_ORACAO[x.titulo]) x.oracao = NOME_DA_ORACAO[x.titulo]; });
    return p;
  }
  const passos = montarPassos();

  /* ---------- Desenho do terço ---------- */

  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("rosary");
  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    (parent || svg).appendChild(e);
    return e;
  }

  const defs = el("defs", {});
  function linear(id, classes, x2, y2) {
    const g = el("linearGradient", { id: id, x1: "0", y1: "0", x2: x2 || "1", y2: y2 || "1" }, defs);
    classes.forEach(c => el("stop", { offset: c[0], class: c[1] }, g));
  }
  linear("gPearl", [["0", "s1"], [".5", "s2"], ["1", "s3"]]);
  // Prata: faixas claras e escuras alternadas imitam o reflexo do metal
  linear("gMetal", [["0", "m1"], [".22", "m2"], [".45", "m3"], [".62", "m1"], [".8", "m2"], ["1", "m3"]], "1", ".6");
  const ouro = el("linearGradient", { id: "gGold", x1: "0", y1: "0", x2: "1", y2: "1" }, defs);
  [["0", "#fff1c2"], [".45", "#e2b456"], ["1", "#8a5a16"]].forEach(s => el("stop", { offset: s[0], "stop-color": s[1] }, ouro));
  const halo0 = el("radialGradient", { id: "gHalo", cx: "50%", cy: "50%", r: "50%" }, defs);
  [["0", .6], [".45", .22], ["1", 0]].forEach(s => el("stop", { offset: s[0], "stop-color": "#e8bd62", "stop-opacity": s[1] }, halo0));
  const sombra = el("radialGradient", { id: "gShadow", cx: "50%", cy: "50%", r: "50%" }, defs);
  [["0", 1], [".55", .55], ["1", 0]].forEach(s => el("stop", { offset: s[0], class: "sh", "stop-opacity": s[1] }, sombra));
  const glow = el("filter", { id: "glow", x: "-100%", y: "-100%", width: "300%", height: "300%" }, defs);
  el("feGaussianBlur", { in: "SourceGraphic", stdDeviation: "2.2", result: "b" }, glow);
  const merge = el("feMerge", {}, glow);
  el("feMergeNode", { in: "b" }, merge);
  el("feMergeNode", { in: "SourceGraphic" }, merge);

  /* ---- Forma do terço: uma gota irregular, como o terço fica apoiado na mão ---- */
  const JX = 180, JY = 338; // junção
  const CTRL = [
    [JX, JY], [226, 298], [270, 246], [306, 178], [314, 112], [288, 58], [236, 30],
    [176, 26], [118, 38], [72, 76], [48, 136], [54, 202], [84, 256], [130, 302]
  ];
  // Curva suave e fechada passando pelos pontos (Catmull-Rom), amostrada em pontos densos
  function curvaFechada(P, passosPorTrecho) {
    const out = [], n = P.length;
    for (let i = 0; i < n; i++) {
      const p0 = P[(i - 1 + n) % n], p1 = P[i], p2 = P[(i + 1) % n], p3 = P[(i + 2) % n];
      for (let k = 0; k < passosPorTrecho; k++) {
        const t = k / passosPorTrecho, t2 = t * t, t3 = t2 * t;
        const f = (a, b, c, d) => .5 * ((2 * b) + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
        out.push([f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])]);
      }
    }
    out.push(out[0].slice());
    return out;
  }
  const curva = curvaFechada(CTRL, 40);
  const acum = [0];
  for (let i = 1; i < curva.length; i++)
    acum.push(acum[i - 1] + Math.hypot(curva[i][0] - curva[i - 1][0], curva[i][1] - curva[i - 1][1]));
  const L = acum[acum.length - 1];
  function pontoEm(d) {
    d = ((d % L) + L) % L;
    let i = 1;
    while (i < acum.length - 1 && acum[i] < d) i++;
    const t = (d - acum[i - 1]) / (acum[i] - acum[i - 1] || 1);
    return [curva[i - 1][0] + (curva[i][0] - curva[i - 1][0]) * t, curva[i - 1][1] + (curva[i][1] - curva[i - 1][1]) * t];
  }

  // Pingente: cai da junção com uma leve curva, até a argola da cruz
  const pingente = t => [JX + 5 * Math.sin(t * Math.PI) - 1.5 * t, JY + t * (482 - JY)];
  const fimPingente = pingente(1);

  // Corrente de elos de metal (sombra + elos)
  const terco = el("g", { id: "terco" });
  const corrente = el("g", {}, terco);
  const pend = el("g", { id: "pend" }, terco);
  const correntePend = el("g", {}, pend);
  const dCurva = "M" + curva.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join("L") + "Z";
  const pp = Array.from({ length: 21 }, (_, i) => pingente(i / 20));
  const dPing = "M" + pp.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join("L");
  [[dCurva, corrente], [dPing, correntePend]].forEach(([d, pai]) => {
    el("path", { d: d, class: "chain-shadow", transform: "translate(.8 1.8)" }, pai);
    el("path", { d: d, class: "chain-under" }, pai);
    el("path", { d: d, class: "chain-links" }, pai);
  });

  const halo = el("g", { id: "halo" }, terco);
  el("circle", { r: 20, cx: 0, cy: 0, fill: "url(#gHalo)", class: "halo-c" }, halo);

  const contas = {}, pos = {};
  const RAIO = { small: 5.8, large: 8.6, junction: 10.6 };
  const HALO = { small: 1, large: 1.35, junction: 1.6, cross: 2.4 };

  // Gerador fixo: cada pedra tem sempre o mesmo formato irregular
  let semente = 20261117;
  const sorteio = () => { semente = (semente * 16807) % 2147483647; return semente / 2147483647; };
  const LUZ = -3 * Math.PI / 4; // luz vindo de cima, à esquerda
  const pts = l => l.map(p => p[0].toFixed(2) + "," + p[1].toFixed(2)).join(" ");

  // Pedra lapidada: contorno irregular, mesa central, facetas iluminadas, brilho e sombra
  function pedra(g, x, y, r) {
    el("ellipse", { cx: x + r * .25, cy: y + r * .45, rx: r * 1.25, ry: r * 1.05, fill: "url(#gShadow)", class: "shadow" }, g);
    const n = 8 + Math.floor(sorteio() * 3);
    const giro = sorteio() * Math.PI * 2;
    const fora = [], mesa = [];
    for (let i = 0; i < n; i++) {
      const ang = giro + (i + (sorteio() - .5) * .5) / n * Math.PI * 2;
      const raio = r * (.86 + sorteio() * .24);
      fora.push([x + raio * Math.cos(ang), y + raio * Math.sin(ang)]);
      const am = ang + Math.PI / n * (.4 + sorteio() * .4);
      const rm = r * (.42 + sorteio() * .1);
      mesa.push([x - r * .08 + rm * Math.cos(am), y - r * .1 + rm * Math.sin(am)]);
    }
    el("polygon", { points: pts(fora), fill: "url(#gPearl)", class: "base" }, g);
    el("polygon", { points: pts(fora), fill: "url(#gGold)", class: "fill" }, g);
    const fac = el("g", { class: "facet" }, g);
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      const mx = (fora[i][0] + fora[j][0]) / 2 - x, my = (fora[i][1] + fora[j][1]) / 2 - y;
      const k = Math.cos(Math.atan2(my, mx) - LUZ);
      // cada faceta tem duas metades com tons diferentes, como na lapidação real
      const meio = [(mesa[i][0] + mesa[j][0]) / 2, (mesa[i][1] + mesa[j][1]) / 2];
      const op1 = k > 0 ? .05 + .45 * k : .26 * -k;
      el("polygon", { points: pts([fora[i], fora[j], meio]), fill: k > 0 ? "#fff" : "#000", "fill-opacity": op1.toFixed(3) }, fac);
      el("polygon", { points: pts([fora[i], meio, mesa[i]]), fill: k > 0 ? "#fff" : "#000", "fill-opacity": (op1 * .6).toFixed(3) }, fac);
      el("polygon", { points: pts([fora[j], mesa[j], meio]), fill: k > 0 ? "#000" : "#fff", "fill-opacity": (.06 + .06 * sorteio()).toFixed(3) }, fac);
    }
    el("polygon", { points: pts(mesa), fill: "#fff", "fill-opacity": .16 }, fac);
    el("polygon", { points: pts(fora), class: "rim" }, fac);
    el("polygon", { points: pts(fora), class: "edge" }, fac);
    el("polyline", { points: pts(mesa.concat([mesa[0]])), class: "edge" }, fac);
    // brilho: um reflexo e um pequeno lampejo em forma de estrela
    el("ellipse", { cx: x - r * .32, cy: y - r * .38, rx: r * .22, ry: r * .13, transform: "rotate(-35 " + (x - r * .32) + " " + (y - r * .38) + ")", class: "glint" }, fac);
    if (r > 6 || sorteio() < .35) {
      const sx = x - r * .2, sy = y - r * .45, a1 = r * .55, a2 = r * .1;
      el("path", { d: "M" + sx + " " + (sy - a1) + "L" + (sx + a2) + " " + (sy - a2) + "L" + (sx + a1) + " " + sy + "L" + (sx + a2) + " " + (sy + a2) +
        "L" + sx + " " + (sy + a1) + "L" + (sx - a2) + " " + (sy + a2) + "L" + (sx - a1) + " " + sy + "L" + (sx - a2) + " " + (sy - a2) + "Z", class: "spark" }, fac);
    }
  }

  // Cruz de prata, com pontas alargadas, chanfro e argola
  function cruz(g) {
    const cx = fimPingente[0], top = 492;
    const d = "M-6.5 0H6.5L4 8V16H16L24 13.5V26.5L16 24H4V64L6.5 74H-6.5L-4 64V24H-16L-24 26.5V13.5L-16 16H-4V8Z";
    const tr = "translate(" + cx + " " + top + ")";
    el("path", { d: d, transform: "translate(" + (cx + 1.6) + " " + (top + 2.6) + ")", class: "cross-shadow" }, g);
    el("circle", { cx: cx, cy: top - 5, r: 3.6, class: "bail" }, g);
    el("path", { d: d, transform: tr, fill: "url(#gMetal)", class: "metal" }, g);
    // chanfro: metade iluminada e metade em sombra de cada braço
    el("path", { d: "M-4 2V64L0 72V2ZM-22 15L-4 18V20H-22Z", transform: tr, fill: "#fff", "fill-opacity": .22 }, g);
    el("path", { d: "M0 2V72L4 64V2ZM4 20V22L22 25V20Z", transform: tr, fill: "#000", "fill-opacity": .14 }, g);
    el("path", { d: d, transform: tr, class: "metal-edge" }, g);
    el("circle", { cx: cx, cy: top + 20, r: 2.2, class: "boss" }, g);
    return [cx, top + 26];
  }

  const NO_PINGENTE = new Set(["p0", "p1", "p2", "p3", "p4", "cruz"]);
  function addConta(id, x, y, tipo) {
    const g = el("g", { class: "b " + tipo }, NO_PINGENTE.has(id) ? pend : terco);
    if (tipo === "cross") { const c = cruz(g); x = c[0]; y = c[1]; }
    else pedra(g, x, y, RAIO[tipo]);
    g.style.transformOrigin = x + "px " + y + "px";
    contas[id] = g;
    pos[id] = { x: x, y: y, s: HALO[tipo] };
  }

  // Volta: começa na conta da junção (Pai Nosso do 1º mistério) e sobe pelo lado direito
  const volta = [{ id: "L1", t: "junction", w: 2.6 }];
  for (let k = 1; k <= 5; k++) {
    if (k > 1) volta.push({ id: "L" + k, t: "large", w: 1.9 });
    for (let j = 1; j <= 10; j++) volta.push({ id: "d" + k + "-" + j, t: "small", w: 1 });
  }
  const W = volta.reduce((s, e) => s + e.w, 0);
  let d = 0;
  volta.forEach((e, i) => {
    if (i > 0) d += e.w / 2 * L / W;
    const p = pontoEm(d);
    addConta(e.id, p[0], p[1], e.t);
    d += e.w / 2 * L / W;
  });

  // Pingente, de cima para baixo: conta grande (Comunhão Espiritual), 3 pequenas (Adoração), conta grande, cruz
  [["p4", .2, "large"], ["p3", .37, "small"], ["p2", .49, "small"], ["p1", .61, "small"], ["p0", .79, "large"]]
    .forEach(c => { const p = pingente(c[1]); addConta(c[0], p[0], p[1], c[2]); });
  addConta("cruz", 0, 0, "cross");

  // Texto no centro da volta
  const meioVolta = curva.reduce((m, p) => [m[0] + p[0], m[1] + p[1]], [0, 0]).map(v => v / curva.length);
  document.getElementById("center").style.top = (meioVolta[1] / 570 * 100) + "%";
  document.getElementById("center").style.left = (meioVolta[0] / 360 * 100) + "%";

  /* ---------- Estado ---------- */

  const KEY = "santo-terco-v2";
  const KEY_AJUSTES = "santo-terco-ajustes";
  const hoje = new Date();
  const hojeStr = hoje.getFullYear() + "-" + (hoje.getMonth() + 1) + "-" + hoje.getDate();
  const conjuntoHoje = MISTERIOS_DO_DIA[hoje.getDay()];

  let state = { date: hojeStr, set: conjuntoHoje, idx: 0 };
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || "null");
    if (s && s.date === hojeStr && MISTERIOS[s.set] && s.idx >= 0 && s.idx <= passos.length) state = s;
  } catch (e) {}
  let ajustes = { tema: "escuro", lingua: "la", som: true, vib: true };
  try {
    const a2 = JSON.parse(localStorage.getItem(KEY_AJUSTES) || "null");
    if (a2) {
      if (a2.tema === "claro" || a2.tema === "escuro") ajustes.tema = a2.tema;
      if (a2.lingua === "la" || a2.lingua === "pt") ajustes.lingua = a2.lingua;
      if (typeof a2.som === "boolean") ajustes.som = a2.som;
      if (typeof a2.vib === "boolean") ajustes.vib = a2.vib;
    }
  } catch (e) {}
  function salvar() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
      localStorage.setItem(KEY_AJUSTES, JSON.stringify(ajustes));
    } catch (e) {}
  }

  /* ---------- Interface ---------- */

  const $ = id => document.getElementById(id);
  const center = $("center"), hint = $("hint"), stage = $("stage");
  let ultimo = -1;

  const conjunto = () => MISTERIOS[state.set][ajustes.lingua];
  const tituloDe = p => p.oracao ? ORACOES[ajustes.lingua][p.oracao].titulo : p.titulo;

  function aplicarTema() {
    document.documentElement.setAttribute("data-tema", ajustes.tema);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", ajustes.tema === "claro" ? "#faf9f4" : "#17251f");
    $("temaEscuro").setAttribute("aria-pressed", ajustes.tema === "escuro");
    $("temaClaro").setAttribute("aria-pressed", ajustes.tema === "claro");
    $("linguaLa").setAttribute("aria-pressed", ajustes.lingua === "la");
    $("linguaPt").setAttribute("aria-pressed", ajustes.lingua === "pt");
    $("somOn").setAttribute("aria-pressed", ajustes.som);
    $("somOff").setAttribute("aria-pressed", !ajustes.som);
    $("vibOn").setAttribute("aria-pressed", ajustes.vib);
    $("vibOff").setAttribute("aria-pressed", !ajustes.vib);
  }

  function renderCabecalho() {
    $("dayLbl").textContent = DIAS[hoje.getDay()] + (state.set === conjuntoHoje ? "" : " · escolhido manualmente");
    $("setLbl").textContent = conjunto().nome;
  }

  function render() {
    const n = passos.length, i = state.idx, fim = i >= n;
    const atuais = new Set(fim ? [] : passos[i].contas);
    const feitas = new Set();
    for (let j = 0; j < Math.min(i, n); j++) passos[j].contas.forEach(c => feitas.add(c));
    const grupo = atuais.size > 1;
    stage.classList.toggle("all", !fim && atuais.size === TODAS.length);

    Object.keys(contas).forEach(id => {
      const b = contas[id], on = atuais.has(id);
      b.classList.toggle("cur", on && !grupo);
      b.classList.toggle("grp", on && grupo);
      b.classList.toggle("done", (feitas.has(id) && !on) || fim);
    });

    if (!fim && !grupo) {
      const id0 = passos[i].contas[0];
      const p = pos[id0];
      // o brilho fica no mesmo grupo da conta, para balançar junto com ela
      const pai = NO_PINGENTE.has(id0) ? pend : terco;
      const antes = NO_PINGENTE.has(id0) ? contas.p4 : contas.L1;
      if (halo.parentNode !== pai || halo.nextSibling !== antes) pai.insertBefore(halo, antes);
      halo.style.transform = "translate(" + p.x + "px," + p.y + "px) scale(" + p.s + ")";
      halo.style.opacity = 1;
    } else {
      halo.style.opacity = 0;
    }

    const s = fim
      ? { secao: "Terço concluído", titulo: "Amém", contagem: "" }
      : passos[i];
    $("kicker").textContent = s.secao || "";
    $("mname").textContent = s.misterio ? conjunto().misterios[s.misterio - 1] : "";
    const t = $("ptitle");
    t.textContent = fim ? s.titulo : tituloDe(s);
    t.classList.toggle("long", t.textContent.length > 22 && t.textContent.length <= 38);
    t.classList.toggle("xlong", t.textContent.length > 38);
    $("count").textContent = s.contagem || "";
    const img = imagemAtual();
    $("imgBtn").hidden = !img;
    if (img) new Image().src = img.arquivo; // já carrega a imagem, para abrir na hora
    sincronizarAudio();
    if (ultimo !== -1 && ultimo !== i) {
      center.classList.remove("swap");
      void center.offsetWidth;
      center.classList.add("swap");
    }
    ultimo = i;

    $("stepLbl").textContent = fim ? "Concluído" : (i + 1) + " / " + n;
    $("bar").style.width = (Math.min(i, n) / n * 100) + "%";
    $("backBtn").disabled = i === 0;
    // no fim do terço, o botão principal vira "Rezar de novo"
    $("textLbl").textContent = fim ? "Rezar de novo" : "Ver oração";
    $("resetBtn").disabled = i === 0;
    $("resetBtn").textContent = "Recomeçar do início";
    $("resetBtn").classList.remove("warn");
    salvar();
  }

  /* ---------- Resposta ao toque: vibração, som de pedra e balanço ---------- */

  const hapticLbl = $("hapticLbl");
  function vibrar(padrao) {
    if (!ajustes.vib) return;
    try {
      if (navigator.vibrate) { navigator.vibrate(padrao); return; }
      // iPhone: alternar um interruptor nativo produz um toque tátil curto
      hapticLbl.click();
    } catch (e) {}
  }

  // Som de duas pedras se tocando, gerado na hora (sem arquivo de áudio)
  let audio = null;
  function somDePedra(forte) {
    if (!ajustes.som) return;
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") audio.resume();
      const t0 = audio.currentTime + .005;
      const batida = (t, vol, freq) => {
        // estalo: ruído curto filtrado na faixa aguda
        const dur = .045, n = Math.floor(audio.sampleRate * dur);
        const buf = audio.createBuffer(1, n, audio.sampleRate), ch = buf.getChannelData(0);
        for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 6);
        const src = audio.createBufferSource(); src.buffer = buf;
        const bp = audio.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = freq; bp.Q.value = 5;
        const g = audio.createGain(); g.gain.value = vol;
        src.connect(bp).connect(g).connect(audio.destination);
        src.start(t);
        // ressonância da pedra: um "tic" agudo que some rápido
        const o = audio.createOscillator(), og = audio.createGain();
        o.type = "sine"; o.frequency.setValueAtTime(freq * 1.35, t);
        og.gain.setValueAtTime(vol * .35, t); og.gain.exponentialRampToValueAtTime(.0001, t + .06);
        o.connect(og).connect(audio.destination); o.start(t); o.stop(t + .07);
      };
      const f = 2600 + Math.random() * 900;
      batida(t0, forte ? .9 : .6, f);
      batida(t0 + .03 + Math.random() * .025, forte ? .35 : .22, f * (1.1 + Math.random() * .2));
    } catch (e) {}
  }

  const tercoEl = document.getElementById("terco");
  let direcao = 1;
  function balancar() {
    direcao = -direcao;
    tercoEl.style.setProperty("--dir", direcao);
    tercoEl.classList.remove("sway");
    void tercoEl.getBoundingClientRect();
    tercoEl.classList.add("sway");
  }

  function avancar() {
    if (state.idx >= passos.length) return;
    state.idx++;
    const s = passos[state.idx];
    vibrar(s && s.novo ? [14, 60, 14] : 10);
    somDePedra(!!(s && s.novo));
    balancar();
    hint.classList.add("gone");
    manterTelaAcesa();
    render();
    if (!$("prayerSheet").hidden) {
      if (state.idx >= passos.length) fecharFolhas(); else preencherOracao();
    }
  }
  function voltar() {
    if (state.idx === 0) return;
    state.idx--;
    vibrar(8);
    somDePedra(false);
    render();
    if (!$("prayerSheet").hidden) preencherOracao();
  }

  // Toque na área do terço = próxima conta
  const tap = $("tap");
  tap.addEventListener("click", e => {
    const r = tap.getBoundingClientRect();
    const dot = document.createElement("span");
    dot.className = "ripple";
    dot.style.left = (e.clientX - r.left) + "px";
    dot.style.top = (e.clientY - r.top) + "px";
    tap.appendChild(dot);
    setTimeout(() => dot.remove(), 700);
    avancar();
  });

  const algumaFolhaAberta = () => ["prayerSheet", "setSheet", "optSheet", "jumpSheet", "viewer", "msgSheet"].some(id => !$(id).hidden);
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { fecharFolhas(); return; }
    if (!$("prayerSheet").hidden && e.key === "ArrowRight") { avancar(); return; }
    if (algumaFolhaAberta()) return;
    if (e.target.tagName === "BUTTON" && (e.key === " " || e.key === "Enter")) return;
    if ([" ", "Enter", "ArrowRight", "ArrowDown"].includes(e.key)) { e.preventDefault(); avancar(); }
    else if (["ArrowLeft", "ArrowUp", "Backspace"].includes(e.key)) { e.preventDefault(); voltar(); }
  });

  $("backBtn").addEventListener("click", voltar);

  function recomecar() {
    state.idx = 0;
    ultimo = -1;
    render();
  }

  // Recomeçar fica nos Ajustes e pede confirmação com um segundo toque
  let resetTimer = null;
  $("resetBtn").addEventListener("click", () => {
    const btn = $("resetBtn");
    if (state.idx === 0) return;
    if (btn.classList.contains("warn")) {
      clearTimeout(resetTimer);
      recomecar();
      fecharFolhas();
      return;
    }
    btn.classList.add("warn");
    btn.textContent = "Toque de novo para confirmar";
    resetTimer = setTimeout(render, 3000);
  });

  /* ---------- Texto da oração ---------- */

  function blocoOracao(chave) {
    const o = ORACOES[ajustes.lingua][chave];
    const box = document.createElement("div");
    box.className = "prayer";
    const h = document.createElement("h3");
    h.textContent = o.titulo;
    box.appendChild(h);
    let p = null;
    o.texto.forEach(linha => {
      if (linha === "") { p = null; return; }
      if (!p) { p = document.createElement("p"); box.appendChild(p); }
      const span = document.createElement("span");
      if (linha.startsWith("# ")) { span.className = "inv"; span.textContent = linha.slice(2); }
      else if (linha.startsWith("> ")) { span.className = "resp"; span.textContent = linha.slice(2); }
      else { span.className = "l"; span.textContent = linha; }
      p.appendChild(span);
    });
    return box;
  }

  function preencherOracao() {
    const s = passos[state.idx];
    $("sheetTitle").textContent = tituloDe(s);
    const sub = [];
    if (s.secao) sub.push(s.secao);
    if (s.misterio) sub.push(conjunto().misterios[s.misterio - 1]);
    if (s.contagem) sub.push(s.contagem);
    $("sheetSub").textContent = sub.join(" · ");
    const body = $("sheetBody");
    body.textContent = "";
    s.oracoes.forEach(k => body.appendChild(blocoOracao(k)));
    body.scrollTop = 0;
  }

  function abrirFolha(id) {
    $(id).hidden = false;
    const x = $(id).querySelector("[data-close].iconbtn");
    if (x) x.focus({ preventScroll: true });
  }
  function fecharFolhas() {
    ["prayerSheet", "setSheet", "optSheet", "jumpSheet", "viewer", "msgSheet"].forEach(id => { $(id).hidden = true; });
  }
  document.querySelectorAll("[data-close]").forEach(n => n.addEventListener("click", fecharFolhas));

  $("textBtn").addEventListener("click", () => {
    if (state.idx >= passos.length) { recomecar(); return; }
    preencherOracao();
    abrirFolha("prayerSheet");
  });
  $("sheetNext").addEventListener("click", avancar);

  /* ---------- Escolha dos mistérios ---------- */

  function preencherConjuntos() {
    const list = $("setList");
    list.textContent = "";
    Object.keys(MISTERIOS).forEach(key => {
      const S = MISTERIOS[key][ajustes.lingua];
      const b = document.createElement("button");
      b.type = "button";
      b.className = "setopt" + (key === state.set ? " sel" : "");
      const txt = document.createElement("span");
      const t = document.createElement("b"); t.textContent = S.nome;
      const d = document.createElement("small"); d.textContent = S.dias;
      txt.appendChild(t); txt.appendChild(d);
      b.appendChild(txt);
      if (key === conjuntoHoje) {
        const tag = document.createElement("span");
        tag.className = "tag"; tag.textContent = "Hoje";
        b.appendChild(tag);
      }
      b.addEventListener("click", () => {
        state.set = key;
        renderCabecalho();
        render();
        fecharFolhas();
      });
      list.appendChild(b);
    });
  }
  $("setBtn").addEventListener("click", () => { preencherConjuntos(); abrirFolha("setSheet"); });

  /* ---------- Imagem do mistério ---------- */

  function imagemAtual() {
    const s = passos[state.idx];
    if (!s || !s.misterio) return null;
    const lista = IMAGENS[state.set];
    return (lista && lista[s.misterio - 1]) || null;
  }
  const viewer = $("viewer"), fig = $("viewerFig");
  $("imgBtn").addEventListener("click", e => {
    e.stopPropagation(); // abrir a imagem não passa a conta
    const img = imagemAtual(), s = passos[state.idx];
    if (!img) return;
    $("viewerImg").src = img.arquivo;
    $("viewerImg").alt = conjunto().misterios[s.misterio - 1];
    $("vKicker").textContent = s.secao;
    $("vName").textContent = conjunto().misterios[s.misterio - 1];
    $("vAutor").textContent = img.autor || "";
    fig.style.transform = ""; fig.style.opacity = "";
    viewer.hidden = false;
    $("viewerClose").focus({ preventScroll: true });
  });
  viewer.addEventListener("click", () => { viewer.hidden = true; });

  /* ---------- Áudio do mistério (player do Spotify) ---------- */

  const PLAY = '<path d="M6 4.2v11.6a.7.7 0 0 0 1.1.6l9-5.8a.7.7 0 0 0 0-1.2l-9-5.8A.7.7 0 0 0 6 4.2z"/>';
  const PAUSE = '<rect x="5" y="4" width="3.6" height="12" rx="1"/><rect x="11.4" y="4" width="3.6" height="12" rx="1"/>';
  const emSegundos = t => { const p = t.split(":").map(Number); return p[0] * 60 + p[1]; };
  const URI_EPISODIO = AUDIO ? "spotify:episode:" + AUDIO.episodio : "";

  // trecho do episódio que pertence ao mistério atual: do seu início até o início do próximo capítulo
  function capituloAtual() {
    const s = passos[state.idx];
    if (!AUDIO || !s || !s.misterio) return null;
    const lista = AUDIO.capitulos[state.set];
    const c = lista && lista[s.misterio - 1];
    if (!c) return null;
    const ini = emSegundos(c.inicio);
    const depois = Object.values(AUDIO.capitulos).flat().map(x => emSegundos(x.inicio)).filter(t => t > ini);
    const fim = depois.length ? Math.min.apply(null, depois) : emSegundos(AUDIO.duracao);
    return { ini: ini, fim: fim, link: c.link, chave: state.set + "-" + s.misterio };
  }

  let spotify = null, controle = null, semPlayer = false, ativo = null, tocando = false, ajustar = false;
  const dock = $("dock");

  function carregarSpotify() {
    if (spotify || semPlayer || document.getElementById("spotifyApi")) return;
    window.onSpotifyIframeApiReady = api => { spotify = api; semPlayer = false; atualizarBotaoAudio(); };
    const sc = document.createElement("script");
    sc.id = "spotifyApi";
    sc.src = "https://open.spotify.com/embed/iframe-api/v1";
    sc.async = true;
    sc.onerror = () => { semPlayer = true; atualizarBotaoAudio(); };
    document.head.appendChild(sc);
    // onde o player não pode ser carregado, o botão abre o capítulo no Spotify
    setTimeout(() => { if (!spotify) { semPlayer = true; atualizarBotaoAudio(); } }, 7000);
  }

  function atualizarBotaoAudio() {
    const cap = capituloAtual(), b = $("vAudio");
    b.hidden = !cap;
    if (!cap) return;
    b.href = cap.link;
    const meu = ativo && ativo.chave === cap.chave && tocando;
    $("vAudioIco").innerHTML = meu ? PAUSE : PLAY;
    $("vAudioLbl").textContent = "Meditação"; // o ícone mostra se está tocando (pausa) ou parado (play)
    b.setAttribute("aria-label", meu ? "Pausar a meditação" : "Ouvir a meditação");
  }

  function tocarCapitulo(cap) {
    ativo = cap;
    ajustar = true;
    dock.hidden = false;
    if (!controle) {
      spotify.createController($("spotifyEmbed"), { uri: URI_EPISODIO, width: "100%", height: 80 }, c => {
        controle = c;
        controle.addListener("ready", () => {
          if (!ativo) return;
          controle.loadUri(URI_EPISODIO, false, ativo.ini);
          controle.play();
        });
        controle.addListener("playback_update", e => {
          const d = e.data, pos = d.position / 1000;
          tocando = !d.isPaused;
          if (ativo && tocando) {
            // garante que começa no capítulo certo e para antes do próximo
            if (ajustar && (pos < ativo.ini - 1 || pos > ativo.fim)) controle.seek(ativo.ini);
            else if (pos >= ativo.fim - .3) { controle.pause(); controle.seek(ativo.ini); tocando = false; }
            if (pos >= ativo.ini - 1 && pos < ativo.fim) ajustar = false;
          }
          atualizarBotaoAudio();
        });
      });
    } else {
      controle.loadUri(URI_EPISODIO, false, cap.ini);
      controle.play();
    }
  }

  function pararAudio() {
    if (controle) controle.pause();
    ativo = null;
    tocando = false;
    dock.hidden = true;
  }

  // ao mudar de mistério, o áudio do anterior para
  function sincronizarAudio() {
    const cap = capituloAtual();
    if (cap) carregarSpotify();
    if (ativo && (!cap || cap.chave !== ativo.chave)) pararAudio();
    atualizarBotaoAudio();
  }

  $("vAudio").addEventListener("click", e => {
    e.stopPropagation(); // tocar o áudio não passa a conta
    const cap = capituloAtual();
    if (!cap || !spotify) return; // sem player: o link abre o capítulo no Spotify
    e.preventDefault();
    if (ativo && ativo.chave === cap.chave && controle) {
      if (tocando) controle.pause(); else controle.resume();
    } else {
      tocarCapitulo(cap);
    }
  });
  $("dockClose").addEventListener("click", pararAudio);
  // arrastar para baixo fecha a imagem
  let y0 = null, dy = 0;
  viewer.addEventListener("touchstart", e => { y0 = e.touches[0].clientY; dy = 0; fig.style.transition = "none"; }, { passive: true });
  viewer.addEventListener("touchmove", e => {
    if (y0 === null) return;
    dy = Math.max(0, e.touches[0].clientY - y0);
    fig.style.transform = "translateY(" + dy + "px)";
    fig.style.opacity = String(Math.max(.3, 1 - dy / 400));
  }, { passive: true });
  viewer.addEventListener("touchend", () => {
    fig.style.transition = "";
    if (dy > 90) viewer.hidden = true;
    else { fig.style.transform = ""; fig.style.opacity = ""; }
    y0 = null;
  });

  /* ---------- Ir para uma posição ---------- */

  function preencherLista() {
    const list = $("jumpList");
    list.textContent = "";
    let grupoAtual = null, atualEl = null;
    passos.forEach((p, i) => {
      const chave = p.secao || null;
      if (chave && chave !== grupoAtual) {
        const h = document.createElement("h4");
        h.textContent = p.secao;
        if (p.misterio) {
          const m = document.createElement("small");
          m.textContent = conjunto().misterios[p.misterio - 1];
          h.appendChild(m);
        }
        list.appendChild(h);
      } else if (!chave && grupoAtual !== null) {
        if (i < 10) {
          const sp = document.createElement("div");
          sp.style.height = "10px";
          list.appendChild(sp);
        } else {
          const h = document.createElement("h4");
          h.textContent = "Orações finais";
          list.appendChild(h);
        }
      }
      grupoAtual = chave;
      const b = document.createElement("button");
      b.type = "button";
      b.className = "jitem" + (i === state.idx ? " atual" : i < state.idx ? " feito" : "");
      const t = document.createElement("span"); t.textContent = tituloDe(p);
      const c = document.createElement("span"); c.textContent = p.contagem || "";
      b.appendChild(t); b.appendChild(c);
      b.addEventListener("click", () => {
        state.idx = i;
        hint.classList.add("gone");
        vibrar(10);
        somDePedra(false);
        balancar();
        render();
        fecharFolhas();
      });
      list.appendChild(b);
      if (i === state.idx) atualEl = b;
    });
    return atualEl;
  }
  $("stepBtn").addEventListener("click", () => {
    const atual = preencherLista();
    abrirFolha("jumpSheet");
    if (atual) atual.scrollIntoView({ block: "center" });
  });

  /* ---------- Ajustes ---------- */

  $("optBtn").addEventListener("click", () => abrirFolha("optSheet"));

  /* ---------- Mensagem para o autor (enviada pelo FormSubmit direto para o e-mail) ---------- */

  const EMAIL_AUTOR = "thiagokf@live.com";
  let tipoMsg = "Sugestão";
  $("msgBtn").addEventListener("click", () => {
    fecharFolhas();
    $("msgStatus").textContent = "";
    $("msgStatus").className = "msg-status";
    abrirFolha("msgSheet");
  });
  document.querySelectorAll("[data-tipo]").forEach(b => b.addEventListener("click", () => {
    tipoMsg = b.dataset.tipo;
    document.querySelectorAll("[data-tipo]").forEach(x => x.setAttribute("aria-pressed", x === b));
  }));
  $("msgForm").addEventListener("submit", async e => {
    e.preventDefault();
    const texto = $("msgTexto").value.trim(), st = $("msgStatus"), btn = $("msgEnviar");
    st.className = "msg-status";
    if (!texto) { st.textContent = "Escreva a mensagem antes de enviar."; $("msgTexto").focus(); return; }
    const nome = $("msgNome").value.trim(), email = $("msgEmail").value.trim();
    btn.disabled = true; btn.textContent = "Enviando…";
    try {
      const r = await fetch("https://formsubmit.co/ajax/" + EMAIL_AUTOR, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({
          _subject: "Santo Terço · " + tipoMsg,
          _template: "table",
          _captcha: "false",
          Tipo: tipoMsg,
          Nome: nome || "(não informado)",
          email: email || undefined,
          Mensagem: texto
        })
      });
      if (!r.ok) throw new Error("http " + r.status);
      st.textContent = "Mensagem enviada. Obrigado!";
      st.className = "msg-status ok";
      $("msgTexto").value = "";
      vibrar(12);
    } catch (err) {
      // sem conexão com o serviço (ou dentro do link do Claude): oferece o app de e-mail
      const assunto = encodeURIComponent("Santo Terço · " + tipoMsg);
      const corpo = encodeURIComponent(texto + (nome ? "\n\n" + nome : ""));
      st.innerHTML = "";
      st.append("Não foi possível enviar daqui. ");
      const a = document.createElement("a");
      a.href = "mailto:" + EMAIL_AUTOR + "?subject=" + assunto + "&body=" + corpo;
      a.textContent = "Abrir no app de e-mail";
      st.append(a, " ou escreva para " + EMAIL_AUTOR + ".");
    } finally {
      btn.disabled = false; btn.textContent = "Enviar";
    }
  });
  $("quick").addEventListener("click", e => e.stopPropagation()); // trocar tema/idioma não passa a conta
  document.querySelectorAll("[data-tema]").forEach(b => b.addEventListener("click", () => {
    ajustes.tema = b.dataset.tema;
    aplicarTema();
    salvar();
  }));
  document.querySelectorAll("[data-som]").forEach(b => b.addEventListener("click", () => {
    ajustes.som = b.dataset.som === "1";
    aplicarTema();
    salvar();
    if (ajustes.som) somDePedra(false);
  }));
  document.querySelectorAll("[data-vib]").forEach(b => b.addEventListener("click", () => {
    ajustes.vib = b.dataset.vib === "1";
    aplicarTema();
    salvar();
    if (ajustes.vib) vibrar(12);
  }));
  document.querySelectorAll("[data-lingua]").forEach(b => b.addEventListener("click", () => {
    ajustes.lingua = b.dataset.lingua;
    aplicarTema();
    renderCabecalho();
    render();
  }));

  /* ---------- Manter a tela acesa ---------- */

  let wake = null;
  async function manterTelaAcesa() {
    try {
      if (wake || !("wakeLock" in navigator) || document.visibilityState !== "visible") return;
      wake = await navigator.wakeLock.request("screen");
      wake.addEventListener("release", () => { wake = null; });
    } catch (e) { wake = null; }
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && state.idx > 0) manterTelaAcesa();
  });

  if (state.idx > 0) hint.classList.add("gone");
  aplicarTema();
  renderCabecalho();
  render();
})();
</script>
</body>
</html>
