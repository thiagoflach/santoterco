<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Santo Terço</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#17251f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Santo Terço">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: uma tela só. Cabeçalho com o mistério do dia, o terço desenhado no centro (toque = próxima conta), ações embaixo.
   Visual de capela: contas de pérola que viram ouro ao serem rezadas. Dois temas, escolhidos no app (escuro é o padrão). */
:root {
  /* Escuro: paleta verde-floresta e areia. Contas = diamantes claros. */
  --bg: #17251f;
  --surface: #1e2f27;
  --raised: #24382f;
  --line: #344b3a;
  --fg: #f1ebdd;
  --muted: #a6a078;
  --accent: #d6c99a;
  --btn: #d6c99a;
  --on-btn: #17251f;
  --chain: #3f5848;
  --gem1: #ffffff;
  --gem2: #dfe7e2;
  --gem3: #8fa298;
  --backdrop: rgba(8, 14, 11, .66);
  --sel: rgba(214, 201, 154, .1);
  --tag-bg: #d6c99a;
  --tag-fg: #17251f;
  --shadow: 0 6px 18px rgba(0, 0, 0, .28);
  --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--bg);
}
:root[data-tema="claro"] {
  /* Claro: marfim, pedra e verde-floresta. Contas = esmeraldas. */
  --bg: #faf9f4;
  --surface: #f4f2ec;
  --raised: #ffffff;
  --line: #d6d3c8;
  --fg: #1b2a22;
  --muted: #767b72;
  --accent: #0f5132;
  --btn: #0f5132;
  --on-btn: #faf9f4;
  --chain: #cdcabe;
  --gem1: #8fdcae;
  --gem2: #1f8050;
  --gem3: #093a23;
  --backdrop: rgba(27, 42, 34, .28);
  --sel: #e6f1e9;
  --tag-bg: #b7d9c1;
  --tag-fg: #0f5132;
  --shadow: 0 6px 16px rgba(27, 42, 34, .08);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; }
body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--ui);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  transition: background .3s, color .3s;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, main:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* Cabeçalho */
.top {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  padding-block: 12px 4px;
}
.setbtn {
  background: none;
  border: 0;
  padding: 4px 0;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.day {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
}
.setname {
  font-family: var(--display);
  font-size: 1.55rem;
  font-weight: 600;
  color: var(--accent);
  line-height: 1.1;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.setname svg { width: 14px; height: 14px; opacity: .7; flex: none; }
.top-right { display: flex; align-items: center; gap: 10px; padding-bottom: 2px; }
.step {
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.iconbtn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--raised);
  box-shadow: var(--shadow);
  display: grid;
  place-items: center;
  flex: none;
}
.iconbtn svg { width: 19px; height: 19px; }

/* Área de toque + terço */
main {
  flex: 1;
  min-height: 0;
  position: relative;
  display: grid;
  place-items: center;
  container-type: size;
  cursor: pointer;
  touch-action: manipulation;
  overflow: hidden;
}
.stage {
  position: relative;
  width: min(100cqw, 63.1cqh);
  aspect-ratio: 360 / 570;
  container-type: inline-size;
}
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

.chain { fill: none; stroke: var(--chain); stroke-width: 1.2; }
.s1 { stop-color: var(--gem1); }
.s2 { stop-color: var(--gem2); }
.s3 { stop-color: var(--gem3); }
.facet { pointer-events: none; }
.edge { fill: none; stroke: #fff; stroke-opacity: .35; stroke-width: .5; stroke-linejoin: round; }
.b { transition: transform .45s cubic-bezier(.3, 1.5, .5, 1); }
.b .fill { opacity: 0; transition: opacity .5s ease; }
.b.done .fill, .b.cur .fill, .b.grp .fill { opacity: 1; }
.b.cur { transform: scale(1.6); }
.b.cur .fill { filter: brightness(1.18); }
.b.large.cur { transform: scale(1.45); }
.b.junction.cur { transform: scale(1.35); }
.b.cross.cur { transform: scale(1.1); }
.b.grp { filter: url(#glow); }
.b.grp.small { transform: scale(1.3); }
.all .b.grp { transform: none; }

#halo { transition: transform .5s cubic-bezier(.4, 0, .2, 1), opacity .4s; }
.halo-c { transform-origin: 0 0; animation: breathe 2.6s ease-in-out infinite; }
@keyframes breathe {
  0%, 100% { transform: scale(.82); opacity: .55; }
  50% { transform: scale(1.12); opacity: 1; }
}

/* Texto no centro do terço */
.center {
  position: absolute;
  left: 50%;
  top: 33%;
  transform: translate(-50%, -50%);
  width: 66%;
  text-align: center;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.2cqw;
}
.center.swap { animation: swapIn .42s ease; }
@keyframes swapIn {
  from { opacity: .15; transform: translate(-50%, calc(-50% + 2cqw)); }
  to { opacity: 1; transform: translate(-50%, -50%); }
}
.kicker {
  font-size: 3.1cqw;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--accent);
  text-wrap: balance;
}
.mname {
  font-family: var(--display);
  font-style: italic;
  font-weight: 500;
  font-size: 4.9cqw;
  line-height: 1.15;
  opacity: .85;
  text-wrap: balance;
}
.ptitle {
  font-family: var(--display);
  font-weight: 700;
  font-size: 9.4cqw;
  line-height: 1.02;
  text-wrap: balance;
  margin-top: 1cqw;
}
.ptitle.long { font-size: 7cqw; }
.ptitle.xlong { font-size: 6cqw; }
.count {
  font-size: 4.2cqw;
  font-weight: 600;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.count:empty, .mname:empty, .kicker:empty { display: none; }

.hint {
  position: absolute;
  bottom: 6px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  letter-spacing: .04em;
  transition: opacity .6s;
  pointer-events: none;
}
.hint.gone { opacity: 0; }

.ripple {
  position: absolute;
  width: 28px;
  height: 28px;
  margin: -14px 0 0 -14px;
  border-radius: 50%;
  border: 1.5px solid var(--accent);
  pointer-events: none;
  animation: rip .65s ease-out forwards;
}
@keyframes rip {
  from { transform: scale(.6); opacity: .7; }
  to { transform: scale(4.5); opacity: 0; }
}

/* Progresso + botões */
.progress {
  height: 3px;
  border-radius: 3px;
  background: var(--line);
  overflow: hidden;
  margin-top: 6px;
}
.progress span {
  display: block;
  height: 100%;
  width: 0;
  background: var(--btn);
  transition: width .45s ease;
}
.bottom {
  display: grid;
  grid-template-columns: 1fr 1.5fr 1fr;
  gap: 10px;
  padding-block: 12px 14px;
}
.btn {
  height: 50px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--raised);
  box-shadow: var(--shadow);
  font-size: 15px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: background .2s, color .2s, border-color .2s, opacity .2s;
}
.btn svg { width: 18px; height: 18px; flex: none; }
.btn:active { background: var(--surface); }
.btn:disabled { opacity: .4; cursor: default; box-shadow: none; }
.btn.primary { background: var(--btn); border-color: var(--btn); color: var(--on-btn); }
.btn.primary:active { filter: brightness(.92); }
.btn.warn { border-color: var(--accent); color: var(--accent); }
.btn.wide { width: 100%; flex: none; }

/* Folhas (oração, mistérios, ajustes) */
.sheet-wrap {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}
.backdrop {
  position: absolute;
  inset: 0;
  background: var(--backdrop);
  animation: fade .25s ease;
}
@keyframes fade { from { opacity: 0; } }
.sheet {
  position: relative;
  max-height: 86%;
  display: flex;
  flex-direction: column;
  gap: 14px;
  background: var(--surface);
  color: var(--fg);
  border-top: 1px solid var(--line);
  border-radius: 22px 22px 0 0;
  padding-top: 10px;
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  animation: up .32s cubic-bezier(.2, .9, .3, 1);
}
@keyframes up { from { transform: translateY(100%); } }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto; flex: none; }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex: none; }
.sheet-head h2 {
  margin: 0;
  font-family: var(--display);
  font-size: 1.7rem;
  font-weight: 700;
  line-height: 1.1;
  text-wrap: balance;
}
.sheet-sub {
  margin: 4px 0 0;
  font-size: 13px;
  color: var(--muted);
}
.sheet-sub:empty { display: none; }
.sheet-body {
  overflow-y: auto;
  -webkit-user-select: text;
  user-select: text;
  display: flex;
  flex-direction: column;
  gap: 26px;
  padding-bottom: 4px;
  min-height: 0;
}
.prayer h3 {
  margin: 0 0 8px;
  font-family: var(--ui);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--accent);
}
.prayer p {
  margin: 0 0 .7em;
  font-family: var(--display);
  font-size: 1.32rem;
  line-height: 1.45;
  max-width: 34em;
}
.prayer p:last-child { margin-bottom: 0; }
.prayer .l, .prayer .inv, .prayer .resp { display: block; }
.prayer .inv { font-weight: 700; }
.prayer .resp { font-style: italic; padding-left: 1.2em; opacity: .85; }

.sets { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
.setopt {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  text-align: left;
  padding: 14px 16px;
  border-radius: 18px;
  border: 1px solid var(--line);
  background: var(--raised);
}
.setopt.sel { border-color: var(--accent); background: var(--sel); }
.setopt b { display: block; font-family: var(--display); font-size: 1.35rem; font-weight: 700; }
.setopt small { color: var(--muted); font-size: 13px; }
.tag {
  flex: none;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--tag-fg);
  background: var(--tag-bg);
  padding: 4px 8px;
  border-radius: 999px;
}

.opts { display: flex; flex-direction: column; gap: 18px; padding-bottom: 6px; }
.opt-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}
.seg {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  padding: 4px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--raised);
}
.seg button {
  height: 44px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  font-size: 15px;
  font-weight: 600;
  color: var(--muted);
  transition: background .2s, color .2s;
}
.seg button[aria-pressed="true"] { background: var(--btn); color: var(--on-btn); }

@media (prefers-reduced-motion: reduce) {
  .halo-c, .center.swap, .ripple, .sheet, .backdrop { animation: none; }
  .b, #halo, .progress span { transition-duration: .01s; }
}
</style>
</head>
<body>

<header class="top">
  <button id="setBtn" class="setbtn" type="button" aria-haspopup="dialog" aria-label="Escolher os mistérios">
    <span class="day" id="dayLbl">Hoje</span>
    <span class="setname"><span id="setLbl">Mistérios</span>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>
    </span>
  </button>
  <div class="top-right">
    <span class="step" id="stepLbl"></span>
    <button id="optBtn" class="iconbtn" type="button" aria-haspopup="dialog" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </div>
</header>

<main id="tap" tabindex="0" role="button" aria-label="Passar para a próxima conta">
  <div class="stage" id="stage">
    <svg id="rosary" viewBox="0 0 360 570" aria-hidden="true"></svg>
    <div class="center" id="center" aria-live="polite">
      <div class="kicker" id="kicker"></div>
      <div class="mname" id="mname"></div>
      <div class="ptitle" id="ptitle"></div>
      <div class="count" id="count"></div>
    </div>
  </div>
  <div class="hint" id="hint">Toque em qualquer lugar para passar a conta</div>
</main>

<div class="progress"><span id="bar"></span></div>

<footer class="bottom">
  <button id="backBtn" class="btn" type="button" aria-label="Voltar uma conta">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l-6 6 6 6"/></svg>Voltar
  </button>
  <button id="textBtn" class="btn primary" type="button">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5.5C8.5 4 6 3.5 3 4v11.5c3-.5 5.5 0 7 1.5 1.5-1.5 4-2 7-1.5V4c-3-.5-5.5 0-7 1.5zM10 5.5V17"/></svg>Ver oração
  </button>
  <button id="resetBtn" class="btn" type="button">Reiniciar</button>
</footer>

<div class="sheet-wrap" id="prayerSheet" hidden>
  <div class="backdrop" data-close></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grab"></div>
    <div class="sheet-head">
      <div>
        <h2 id="sheetTitle">Oração</h2>
        <p class="sheet-sub" id="sheetSub"></p>
      </div>
      <button class="iconbtn" type="button" data-close aria-label="Fechar">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
    <button class="btn primary wide" id="sheetNext" type="button">Próxima conta
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4l6 6-6 6"/></svg>
    </button>
  </section>
</div>

<div class="sheet-wrap" id="setSheet" hidden>
  <div class="backdrop" data-close></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <div class="grab"></div>
    <div class="sheet-head">
      <h2 id="setTitle">Mistérios do Rosário</h2>
      <button class="iconbtn" type="button" data-close aria-label="Fechar">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13"/></svg>
      </button>
    </div>
    <div class="sets" id="setList"></div>
  </section>
</div>

<div class="sheet-wrap" id="optSheet" hidden>
  <div class="backdrop" data-close></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="optTitle">
    <div class="grab"></div>
    <div class="sheet-head">
      <h2 id="optTitle">Ajustes</h2>
      <button class="iconbtn" type="button" data-close aria-label="Fechar">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13"/></svg>
      </button>
    </div>
    <div class="opts">
      <div>
        <div class="opt-label" id="lblTema">Tema</div>
        <div class="seg" role="group" aria-labelledby="lblTema">
          <button type="button" id="temaEscuro" data-tema="escuro">Escuro</button>
          <button type="button" id="temaClaro" data-tema="claro">Claro</button>
        </div>
      </div>
      <div>
        <div class="opt-label" id="lblLingua">Idioma das orações</div>
        <div class="seg" role="group" aria-labelledby="lblLingua">
          <button type="button" id="linguaLa" data-lingua="la">Latim</button>
          <button type="button" id="linguaPt" data-lingua="pt">Português</button>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- Textos das orações e nomes dos mistérios: edite em oracoes.js -->
<script src="oracoes.js"></script>
<script>
(function () {
  "use strict";

  const ORACOES = window.ORACOES;
  const MISTERIOS = window.MISTERIOS;
  const MISTERIOS_DO_DIA = window.MISTERIOS_DO_DIA;
  const DIAS = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"];

  /* ---------- Estrutura do terço ----------
     Cada passo = um toque na tela.
     titulo/secao: exatamente como nos arquivos da estrutura.
     contas: posição selecionada no terço.
     oracoes: chaves de ORACOES, na ordem em que aparecem. */

  const CRUZ = "cruz";
  const dezena = k => Array.from({ length: 10 }, (_, j) => "d" + k + "-" + (j + 1));
  const TODAS = ["cruz", "p0", "p1", "p2", "p3", "p4"]
    .concat([1, 2, 3, 4, 5].flatMap(k => ["L" + k].concat(dezena(k))));
  const ORDINAIS = ["Primeiro", "Segundo", "Terceiro", "Quarto", "Quinto"];

  function montarPassos() {
    const p = [];
    const visita = "Visita ao Santíssimo Sacramento";
    ["p1", "p2", "p3"].forEach((c, i) => p.push({
      secao: visita, titulo: "Adoração ao Santíssimo Sacramento", contagem: (i + 1) + " de 3",
      contas: [c], oracoes: ["adoracao", "paiNosso", "aveMaria", "gloria"]
    }));
    p.push({ secao: visita, titulo: "Comunhão Espiritual", contas: ["p4"], oracoes: ["adoracao", "comunhaoEspiritual"] });
    p.push({ titulo: "Sinal da Santa Cruz", contas: [CRUZ], oracoes: ["sinalDaCruz"] });
    p.push({ titulo: "Ato de Contrição", contas: [CRUZ], oracoes: ["atoDeContricao", "gloria"] });

    for (let k = 1; k <= 5; k++) {
      const secao = ORDINAIS[k - 1] + " Mistério";
      p.push({ secao, misterio: k, titulo: "Pai Nosso", contas: ["L" + k], oracoes: ["paiNosso"], novo: true });
      for (let j = 1; j <= 10; j++)
        p.push({ secao, misterio: k, titulo: "Ave Maria", contagem: j + " de 10", contas: ["d" + k + "-" + j], oracoes: ["aveMaria"] });
      p.push({ secao, misterio: k, titulo: "Glória ao Pai", contas: dezena(k), oracoes: ["gloria"] });
      p.push({ secao, misterio: k, titulo: "Oração de Fátima", contas: dezena(k), oracoes: ["oracaoDeFatima"] });
    }

    p.push({ titulo: "Ave Maria, Filha de Deus Pai", contas: TODAS, oracoes: ["aveFilha"], novo: true });
    p.push({ titulo: "Ave Maria, Mãe de Deus Filho", contas: TODAS, oracoes: ["aveMae"] });
    p.push({ titulo: "Ave Maria, Esposa de Deus Espírito Santo", contas: TODAS, oracoes: ["aveEsposa"] });
    p.push({ titulo: "Ladainha a Nossa Senhora", contas: TODAS, oracoes: ["ladainha"] });
    p.push({ titulo: "Para as necessidades da Igreja e do Estado", contas: TODAS, oracoes: ["paiNosso", "aveMaria", "gloria"] });
    p.push({ titulo: "Para a pessoa e as intenções do senhor Bispo desta Diocese", contas: TODAS, oracoes: ["paiNosso", "aveMaria", "gloria"] });
    p.push({ titulo: "Para as benditas almas do Purgatório", contas: TODAS, oracoes: ["paiNosso", "aveMaria", "gloria"] });
    return p;
  }
  const passos = montarPassos();

  /* ---------- Desenho do terço ---------- */

  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("rosary");
  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    (parent || svg).appendChild(e);
    return e;
  }

  const defs = el("defs", {});
  const pearl = el("linearGradient", { id: "gPearl", x1: "0", y1: "0", x2: "1", y2: "1" }, defs);
  [["0", "s1"], [".5", "s2"], ["1", "s3"]].forEach(s => el("stop", { offset: s[0], class: s[1] }, pearl));
  function radial(id, stops, cx, cy) {
    const g = el("radialGradient", { id: id, cx: cx || "35%", cy: cy || "30%", r: "75%" }, defs);
    stops.forEach(s => el("stop", { offset: s[0], "stop-color": s[1], "stop-opacity": s[2] == null ? 1 : s[2] }, g));
  }
  const ouro = el("linearGradient", { id: "gGold", x1: "0", y1: "0", x2: "1", y2: "1" }, defs);
  [["0", "#fff1c2"], [".45", "#e2b456"], ["1", "#8a5a16"]].forEach(s => el("stop", { offset: s[0], "stop-color": s[1] }, ouro));
  radial("gHalo", [["0", "#f4c86a", .6], [".45", "#e3b75e", .22], ["1", "#e3b75e", 0]], "50%", "50%");
  const glow = el("filter", { id: "glow", x: "-100%", y: "-100%", width: "300%", height: "300%" }, defs);
  el("feGaussianBlur", { in: "SourceGraphic", stdDeviation: "2.2", result: "b" }, glow);
  const merge = el("feMerge", {}, glow);
  el("feMergeNode", { in: "b" }, merge);
  el("feMergeNode", { in: "SourceGraphic" }, merge);

  const CX = 180, CY = 188, R = 150;
  el("circle", { cx: CX, cy: CY, r: R, class: "chain" });
  el("line", { x1: CX, y1: CY + R, x2: CX, y2: 490, class: "chain" });

  const halo = el("g", { id: "halo" });
  el("circle", { r: 20, cx: 0, cy: 0, fill: "url(#gHalo)", class: "halo-c" }, halo);

  const contas = {}, pos = {};
  const RAIO = { small: 5.8, large: 8.6, junction: 10.6 };
  const HALO = { small: 1, large: 1.35, junction: 1.6, cross: 2.7 };

  // Gerador fixo: cada pedra tem sempre o mesmo formato irregular
  let semente = 20261117;
  const sorteio = () => { semente = (semente * 16807) % 2147483647; return semente / 2147483647; };
  const LUZ = -3 * Math.PI / 4; // luz vindo de cima, à esquerda
  const pts = l => l.map(p => p[0].toFixed(2) + "," + p[1].toFixed(2)).join(" ");

  // Pedra lapidada: contorno irregular, mesa central e facetas iluminadas
  function pedra(g, x, y, r) {
    const n = 7 + Math.floor(sorteio() * 3);
    const giro = sorteio() * Math.PI * 2;
    const fora = [], mesa = [];
    for (let i = 0; i < n; i++) {
      const ang = giro + (i + (sorteio() - .5) * .55) / n * Math.PI * 2;
      const raio = r * (.84 + sorteio() * .28);
      fora.push([x + raio * Math.cos(ang), y + raio * Math.sin(ang)]);
      const am = ang + Math.PI / n * (.4 + sorteio() * .4);
      const rm = r * (.4 + sorteio() * .12);
      mesa.push([x - r * .08 + rm * Math.cos(am), y - r * .1 + rm * Math.sin(am)]);
    }
    el("polygon", { points: pts(fora), fill: "url(#gPearl)", class: "base" }, g);
    el("polygon", { points: pts(fora), fill: "url(#gGold)", class: "fill" }, g);
    const fac = el("g", { class: "facet" }, g);
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      const mx = (fora[i][0] + fora[j][0]) / 2 - x, my = (fora[i][1] + fora[j][1]) / 2 - y;
      const k = Math.cos(Math.atan2(my, mx) - LUZ);
      el("polygon", {
        points: pts([fora[i], fora[j], mesa[j], mesa[i]]),
        fill: k > 0 ? "#fff" : "#000",
        "fill-opacity": (k > 0 ? .06 + .42 * k : .24 * -k).toFixed(3)
      }, fac);
    }
    el("polygon", { points: pts(mesa), fill: "#fff", "fill-opacity": .2 }, fac);
    el("polygon", { points: pts(fora), class: "edge" }, fac);
    el("polygon", { points: pts(mesa), class: "edge" }, fac);
  }

  function addConta(id, x, y, tipo) {
    const g = el("g", { class: "b " + tipo });
    g.style.transformOrigin = x + "px " + y + "px";
    if (tipo === "cross") {
      const d = "M175 486h10v15h15v10h-15v45h-10v-45h-15v-10h15z";
      el("path", { d: d, fill: "url(#gPearl)", class: "base" }, g);
      el("path", { d: d, fill: "url(#gGold)", class: "fill" }, g);
      const fac = el("g", { class: "facet" }, g);
      // lado iluminado e lado em sombra de cada braço, como uma pedra talhada
      el("path", { d: "M175 486h5v65h-5zM160 501h20v5h-20z", fill: "#fff", "fill-opacity": .3 }, fac);
      el("path", { d: "M180 486h5v65h-5zM180 506h20v5h-20z", fill: "#000", "fill-opacity": .16 }, fac);
      el("path", { d: d, class: "edge" }, fac);
    } else {
      pedra(g, x, y, RAIO[tipo]);
    }
    contas[id] = g;
    pos[id] = { x: x, y: y, s: HALO[tipo] };
  }

  // Volta: começa na conta grande da junção (Pai Nosso do 1º mistério) e sobe pelo lado direito
  const volta = [{ id: "L1", t: "junction", w: 2.6 }];
  for (let k = 1; k <= 5; k++) {
    if (k > 1) volta.push({ id: "L" + k, t: "large", w: 1.9 });
    for (let j = 1; j <= 10; j++) volta.push({ id: "d" + k + "-" + j, t: "small", w: 1 });
  }
  const W = volta.reduce((s, e) => s + e.w, 0);
  const u = 2 * Math.PI / W;
  let a = Math.PI / 2;
  volta.forEach((e, i) => {
    if (i > 0) a -= e.w / 2 * u;
    addConta(e.id, CX + R * Math.cos(a), CY + R * Math.sin(a), e.t);
    a -= e.w / 2 * u;
  });

  // Pingente, de cima para baixo: conta grande (Comunhão Espiritual), 3 pequenas (Adoração), conta grande, cruz
  addConta("p4", CX, 370, "large");
  addConta("p3", CX, 396, "small");
  addConta("p2", CX, 416, "small");
  addConta("p1", CX, 436, "small");
  addConta("p0", CX, 464, "large");
  addConta("cruz", CX, 521, "cross");

  /* ---------- Estado ---------- */

  const KEY = "santo-terco-v2";
  const KEY_AJUSTES = "santo-terco-ajustes";
  const hoje = new Date();
  const hojeStr = hoje.getFullYear() + "-" + (hoje.getMonth() + 1) + "-" + hoje.getDate();
  const conjuntoHoje = MISTERIOS_DO_DIA[hoje.getDay()];

  let state = { date: hojeStr, set: conjuntoHoje, idx: 0 };
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || "null");
    if (s && s.date === hojeStr && MISTERIOS[s.set] && s.idx >= 0 && s.idx <= passos.length) state = s;
  } catch (e) {}
  let ajustes = { tema: "escuro", lingua: "la" };
  try {
    const a2 = JSON.parse(localStorage.getItem(KEY_AJUSTES) || "null");
    if (a2) {
      if (a2.tema === "claro" || a2.tema === "escuro") ajustes.tema = a2.tema;
      if (a2.lingua === "la" || a2.lingua === "pt") ajustes.lingua = a2.lingua;
    }
  } catch (e) {}
  function salvar() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
      localStorage.setItem(KEY_AJUSTES, JSON.stringify(ajustes));
    } catch (e) {}
  }

  /* ---------- Interface ---------- */

  const $ = id => document.getElementById(id);
  const center = $("center"), hint = $("hint"), stage = $("stage");
  let ultimo = -1;

  const conjunto = () => MISTERIOS[state.set][ajustes.lingua];

  function aplicarTema() {
    document.documentElement.setAttribute("data-tema", ajustes.tema);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", ajustes.tema === "claro" ? "#faf9f4" : "#17251f");
    $("temaEscuro").setAttribute("aria-pressed", ajustes.tema === "escuro");
    $("temaClaro").setAttribute("aria-pressed", ajustes.tema === "claro");
    $("linguaLa").setAttribute("aria-pressed", ajustes.lingua === "la");
    $("linguaPt").setAttribute("aria-pressed", ajustes.lingua === "pt");
  }

  function renderCabecalho() {
    $("dayLbl").textContent = DIAS[hoje.getDay()] + (state.set === conjuntoHoje ? "" : " · escolhido manualmente");
    $("setLbl").textContent = conjunto().nome;
  }

  function render() {
    const n = passos.length, i = state.idx, fim = i >= n;
    const atuais = new Set(fim ? [] : passos[i].contas);
    const feitas = new Set();
    for (let j = 0; j < Math.min(i, n); j++) passos[j].contas.forEach(c => feitas.add(c));
    const grupo = atuais.size > 1;
    stage.classList.toggle("all", !fim && atuais.size === TODAS.length);

    Object.keys(contas).forEach(id => {
      const b = contas[id], on = atuais.has(id);
      b.classList.toggle("cur", on && !grupo);
      b.classList.toggle("grp", on && grupo);
      b.classList.toggle("done", (feitas.has(id) && !on) || fim);
    });

    if (!fim && !grupo) {
      const p = pos[passos[i].contas[0]];
      halo.style.transform = "translate(" + p.x + "px," + p.y + "px) scale(" + p.s + ")";
      halo.style.opacity = 1;
    } else {
      halo.style.opacity = 0;
    }

    const s = fim
      ? { secao: "Terço concluído", titulo: "Amém", contagem: "" }
      : passos[i];
    $("kicker").textContent = s.secao || "";
    $("mname").textContent = s.misterio ? conjunto().misterios[s.misterio - 1] : "";
    const t = $("ptitle");
    t.textContent = s.titulo || "";
    t.classList.toggle("long", t.textContent.length > 22 && t.textContent.length <= 38);
    t.classList.toggle("xlong", t.textContent.length > 38);
    $("count").textContent = s.contagem || "";
    if (ultimo !== -1 && ultimo !== i) {
      center.classList.remove("swap");
      void center.offsetWidth;
      center.classList.add("swap");
    }
    ultimo = i;

    $("stepLbl").textContent = fim ? "Concluído" : (i + 1) + " / " + n;
    $("bar").style.width = (Math.min(i, n) / n * 100) + "%";
    $("backBtn").disabled = i === 0;
    $("textBtn").disabled = fim;
    $("resetBtn").textContent = fim ? "Rezar de novo" : "Reiniciar";
    $("resetBtn").classList.remove("warn");
    salvar();
  }

  function vibrar(padrao) {
    try { if (navigator.vibrate) navigator.vibrate(padrao); } catch (e) {}
  }

  function avancar() {
    if (state.idx >= passos.length) return;
    state.idx++;
    const s = passos[state.idx];
    vibrar(s && s.novo ? [18, 70, 18] : 12);
    hint.classList.add("gone");
    manterTelaAcesa();
    render();
    if (!$("prayerSheet").hidden) {
      if (state.idx >= passos.length) fecharFolhas(); else preencherOracao();
    }
  }
  function voltar() {
    if (state.idx === 0) return;
    state.idx--;
    vibrar(8);
    render();
    if (!$("prayerSheet").hidden) preencherOracao();
  }

  // Toque na área do terço = próxima conta
  const tap = $("tap");
  tap.addEventListener("click", e => {
    const r = tap.getBoundingClientRect();
    const dot = document.createElement("span");
    dot.className = "ripple";
    dot.style.left = (e.clientX - r.left) + "px";
    dot.style.top = (e.clientY - r.top) + "px";
    tap.appendChild(dot);
    setTimeout(() => dot.remove(), 700);
    avancar();
  });

  const algumaFolhaAberta = () => ["prayerSheet", "setSheet", "optSheet"].some(id => !$(id).hidden);
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { fecharFolhas(); return; }
    if (!$("prayerSheet").hidden && e.key === "ArrowRight") { avancar(); return; }
    if (algumaFolhaAberta()) return;
    if (e.target.tagName === "BUTTON" && (e.key === " " || e.key === "Enter")) return;
    if ([" ", "Enter", "ArrowRight", "ArrowDown"].includes(e.key)) { e.preventDefault(); avancar(); }
    else if (["ArrowLeft", "ArrowUp", "Backspace"].includes(e.key)) { e.preventDefault(); voltar(); }
  });

  $("backBtn").addEventListener("click", voltar);

  // Reiniciar pede confirmação com um segundo toque
  let resetTimer = null;
  $("resetBtn").addEventListener("click", () => {
    const btn = $("resetBtn");
    if (state.idx === 0) return;
    if (state.idx >= passos.length || btn.classList.contains("warn")) {
      clearTimeout(resetTimer);
      state.idx = 0;
      ultimo = -1;
      render();
      return;
    }
    btn.classList.add("warn");
    btn.textContent = "Confirmar?";
    resetTimer = setTimeout(render, 3000);
  });

  /* ---------- Texto da oração ---------- */

  function blocoOracao(chave) {
    const o = ORACOES[ajustes.lingua][chave];
    const box = document.createElement("div");
    box.className = "prayer";
    const h = document.createElement("h3");
    h.textContent = o.titulo;
    box.appendChild(h);
    let p = null;
    o.texto.forEach(linha => {
      if (linha === "") { p = null; return; }
      if (!p) { p = document.createElement("p"); box.appendChild(p); }
      const span = document.createElement("span");
      if (linha.startsWith("# ")) { span.className = "inv"; span.textContent = linha.slice(2); }
      else if (linha.startsWith("> ")) { span.className = "resp"; span.textContent = linha.slice(2); }
      else { span.className = "l"; span.textContent = linha; }
      p.appendChild(span);
    });
    return box;
  }

  function preencherOracao() {
    const s = passos[state.idx];
    $("sheetTitle").textContent = s.titulo;
    const sub = [];
    if (s.secao) sub.push(s.secao);
    if (s.misterio) sub.push(conjunto().misterios[s.misterio - 1]);
    if (s.contagem) sub.push(s.contagem);
    $("sheetSub").textContent = sub.join(" · ");
    const body = $("sheetBody");
    body.textContent = "";
    s.oracoes.forEach(k => body.appendChild(blocoOracao(k)));
    body.scrollTop = 0;
  }

  function abrirFolha(id) {
    $(id).hidden = false;
    const x = $(id).querySelector("[data-close].iconbtn");
    if (x) x.focus({ preventScroll: true });
  }
  function fecharFolhas() {
    ["prayerSheet", "setSheet", "optSheet"].forEach(id => { $(id).hidden = true; });
  }
  document.querySelectorAll("[data-close]").forEach(n => n.addEventListener("click", fecharFolhas));

  $("textBtn").addEventListener("click", () => {
    if (state.idx >= passos.length) return;
    preencherOracao();
    abrirFolha("prayerSheet");
  });
  $("sheetNext").addEventListener("click", avancar);

  /* ---------- Escolha dos mistérios ---------- */

  function preencherConjuntos() {
    const list = $("setList");
    list.textContent = "";
    Object.keys(MISTERIOS).forEach(key => {
      const S = MISTERIOS[key][ajustes.lingua];
      const b = document.createElement("button");
      b.type = "button";
      b.className = "setopt" + (key === state.set ? " sel" : "");
      const txt = document.createElement("span");
      const t = document.createElement("b"); t.textContent = S.nome;
      const d = document.createElement("small"); d.textContent = S.dias;
      txt.appendChild(t); txt.appendChild(d);
      b.appendChild(txt);
      if (key === conjuntoHoje) {
        const tag = document.createElement("span");
        tag.className = "tag"; tag.textContent = "Hoje";
        b.appendChild(tag);
      }
      b.addEventListener("click", () => {
        state.set = key;
        renderCabecalho();
        render();
        fecharFolhas();
      });
      list.appendChild(b);
    });
  }
  $("setBtn").addEventListener("click", () => { preencherConjuntos(); abrirFolha("setSheet"); });

  /* ---------- Ajustes ---------- */

  $("optBtn").addEventListener("click", () => abrirFolha("optSheet"));
  document.querySelectorAll("[data-tema]").forEach(b => b.addEventListener("click", () => {
    ajustes.tema = b.dataset.tema;
    aplicarTema();
    salvar();
  }));
  document.querySelectorAll("[data-lingua]").forEach(b => b.addEventListener("click", () => {
    ajustes.lingua = b.dataset.lingua;
    aplicarTema();
    renderCabecalho();
    render();
  }));

  /* ---------- Manter a tela acesa ---------- */

  let wake = null;
  async function manterTelaAcesa() {
    try {
      if (wake || !("wakeLock" in navigator) || document.visibilityState !== "visible") return;
      wake = await navigator.wakeLock.request("screen");
      wake.addEventListener("release", () => { wake = null; });
    } catch (e) { wake = null; }
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && state.idx > 0) manterTelaAcesa();
  });

  if (state.idx > 0) hint.classList.add("gone");
  aplicarTema();
  renderCabecalho();
  render();
})();
</script>
</body>
</html>
